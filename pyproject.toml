[project]
name = "percepcion3d"
version = "0.1.0"
description = "Edge-Ready 3D Spatial Perception and Metric Tracking Pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Perception Team" }]
# Pure-CPU core: geometry, fusion, tracking, safety. Installable without a GPU.
dependencies = [
    "numpy>=1.26.4,<2.0.0",
    "opencv-python-headless>=4.10.0.84",
    "pyyaml>=6.0.2",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
# GPU inference runtime (TensorRT 10.x engines are not portable across majors).
runtime = [
    "tensorrt-cu12>=10.3.0,<11",
    "cuda-python>=12.4.0",
    "rerun-sdk>=0.18.0",
    "nvidia-ml-py>=12.560.30",
]
# ONNX export and exploratory benchmarking only; never imported by the runtime.
export = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.3.0,<9",
    "transformers>=4.45.0,<5",
    "onnx>=1.16.0,<2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-benchmark>=4.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
    # ONNX graph surgery tests run the modified graph on CPU.
    "onnx>=1.16.0,<2",
    "onnxruntime>=1.18.0,<2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests requiring hardware timing guarantees (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring a CUDA-capable GPU (deselect with '-m \"not gpu\"')",
]