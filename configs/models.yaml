# Model export / runtime configuration. Engines are GPU + TensorRT-version
# specific: build them on the target machine (scripts/export_trt.sh), never
# commit them.
detector:
  # Ultralytics checkpoint (downloaded on first use by the `export` extra).
  weights: yolo11n.pt
  # Network input (H, W). Multiple of 32. 1024x320 keeps KITTI's 3.3:1 aspect
  # with ~4 % vertical padding instead of ~70 % at 640x640.
  input_hw: [320, 1024]
  onnx: models/detector_1024x320.onnx
  engine: models/detector_1024x320_fp16.engine
  precision: fp16          # fp16 | int8 (int8 needs a calibration cache; F2 measures fp16 first)
  nms:
    score_threshold: 0.25
    iou_threshold: 0.6
    max_output_boxes: 100
    class_agnostic: false
  # Runtime post-filter (frame coordinates).
  min_box_px: 2.0
  # COCO ids kept by the runtime; empty = all.
  keep_class_ids: [0, 1, 2, 3, 5, 7]   # person bicycle car motorcycle bus truck
  class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat,
    traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse,
    sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
    frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard,
    surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana,
    apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
    potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard,
    cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors,
    teddy bear, hair drier, toothbrush]
  # KITTI type -> COCO class names that count as a hit (export validation).
  kitti_to_coco:
    Car: [car, truck]
    Van: [car, truck, bus]
    Truck: [truck, bus]
    Pedestrian: [person]
    Cyclist: [bicycle, motorcycle, person]

# Definition of Done for F2 (measured on the target GPU, FP16, YOLO-n 1024x320).
dod:
  detector_p95_ms: 6.0
  detector_vram_mb: 900
  recall_car: 0.85
  recall_pedestrian: 0.60
