# Detector sized for BDD100K / dashcam 1280×720 (≈16:9).
# 384×672 (H×W, multiples of 32): aspect 1.75 ≈ 16/9=1.78 → ~1 % letterbox pad
# vs ~45 % vertical pad when forcing KITTI's 1024×320 (aspect 3.2) on 16:9.
# Depth stays the same engines as models.yaml (rebuilt on-target).
detector:
  weights: yolo11n.pt
  input_hw: [384, 672]
  onnx: models/detector_672x384.onnx
  engine: models/detector_672x384_fp16.engine
  precision: fp16
  nms:
    score_threshold: 0.25
    iou_threshold: 0.6
    max_output_boxes: 100
    class_agnostic: false
  min_box_px: 2.0
  keep_class_ids: [0, 1, 2, 3, 5, 7]
  class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat,
    traffic light, fire hydrant, stop sign, parking meter, bench, bird, cat, dog, horse,
    sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase,
    frisbee, skis, snowboard, sports ball, kite, baseball bat, baseball glove, skateboard,
    surfboard, tennis racket, bottle, wine glass, cup, fork, knife, spoon, bowl, banana,
    apple, sandwich, orange, broccoli, carrot, hot dog, pizza, donut, cake, chair, couch,
    potted plant, bed, dining table, toilet, tv, laptop, mouse, remote, keyboard,
    cell phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors,
    teddy bear, hair drier, toothbrush]
  kitti_to_coco:
    Car: [car, truck]
    Van: [car, truck, bus]
    Truck: [truck, bus]
    Pedestrian: [person]
    Cyclist: [bicycle, motorcycle, person]

depth:
  weights: depth-anything/Depth-Anything-V2-Small-hf
  variant: relative
  # 210×700 (~0.7× area of 252×840) for BDD F7 depth-Hz headroom; multiples of 14.
  input_sizes: [[280, 924], [252, 840], [322, 1064], [210, 700]]
  onnx: models/depth_{w}x{h}.onnx
  engine: models/depth_{w}x{h}_fp16.engine
  precision: fp16
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  store_fp16: true

dod:
  detector_p95_ms: 6.0
  detector_vram_mb: 900
  recall_car: 0.85
  recall_pedestrian: 0.60
  depth_p95_ms: 25.0
  detector_p99_contended_ms: 8.0
  total_vram_mb: 2000
  depth_spearman_road: 0.95
