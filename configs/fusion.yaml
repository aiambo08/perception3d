# F4 · Fusión métrica (depth/fusion.py, depth/ground_solver.py, depth/sampling.py)

# Priors de clase: altura (media, σ) y longitud (para pasar del contacto más cercano
# al centro del objeto). `thin`: el objeto ocupa una minoría de su caja → se toma el
# modo cercano si la caja es bimodal. Los nombres son los de COCO (detector) más alias.
classes:
  person:
    height_m: 1.70
    sigma_height_m: 0.12
    length_m: 0.50
    thin: true
    aliases: [pedestrian]
  bicycle:
    height_m: 1.60
    sigma_height_m: 0.15
    length_m: 1.70
    thin: true
    aliases: [cyclist]
  motorcycle:
    height_m: 1.40
    sigma_height_m: 0.15
    length_m: 2.10
    thin: true
  car:
    height_m: 1.52
    sigma_height_m: 0.14
    length_m: 4.30
    aliases: [van]
  truck:
    height_m: 3.20
    sigma_height_m: 0.60
    length_m: 8.00
  bus:
    height_m: 3.20
    sigma_height_m: 0.40
    length_m: 11.00

noise:
  sigma_pitch_deg: 0.5      # σ_θ del montaje (frenadas, carga); término correlado entre Z_g y Z_n
  sigma_row_px: 1.5         # σ de la fila de contacto (jitter del detector + ambigüedad del contacto)
  sigma_col_px: 1.5
  net_rel_sigma: 0.05       # k: error relativo de 1/Z de la red tras la corrección afín

gates:
  z_min_m: 1.0
  z_max_m: 80.0             # rango operativo: la fusión se marca OUT_OF_RANGE fuera de él
  range_slack: 1.5          # una pista individual sólo se descarta fuera de [z_min/1.5, z_max·1.5]
  min_box_height_px: 12
  border_margin_px: 2       # caja a ≤ 2 px del borde → truncada (sin Z_g abajo, sin Z_h arriba/abajo)
  chi2_consistency: 6.635   # χ² 99 % (1 gdl) para dos estimadores; con tres se usa 9.21

sampling:
  shrink: 0.2               # recorte del ROI interior por lado
  max_pixels: 1024
  min_pixels: 9
  split_k: 4.0              # bimodal si |mediana_hi − mediana_lo| > 4·σ_pooled
  min_cluster_frac: 0.15
  split_min_spread: 0.05    # buscar bimodalidad sólo si el rango 10–90 % supera el 5 % de la mediana
  exclude_dilate_px: 3      # dilatación de las cajas oclusoras al excluirlas del ROI (jitter del detector)

# Muestreo de calzada para el ajuste afín (s, t): d̂ ≈ s·(1/Z_c) + t
road:
  max_points: 2000
  horizon_margin_px: 20
  z_min_m: 3.0
  z_max_m: 60.0
  lateral_band: 0.6         # fracción del ancho alrededor de la columna principal
  box_dilate_px: 4

affine_filter:              # paseo aleatorio en (s, t) con gating χ² (2 gdl, 99 %)
  q_s_rel_per_s: 0.05
  q_t_rel_per_s: 0.05
  r_floor_rel: 0.005
  reset_after_rejects: 15
  min_inlier_ratio: 0.5

pitch_filter:               # pitch en línea desde alturas de clase (ver ground_solver.py)
  sigma0_deg: 1.0
  q_deg_per_sqrt_s: 0.3
  min_objects: 1
  max_step_deg: 3.0
