# F6 · Cinemática y seguridad (safety/kinematics.py, safety/gates.py, safety/ttc.py)
#
# Marco: suelo del ego, X derecha, Z hacia delante, origen en el frontal. Las posiciones
# del tracker (origen cámara) se desplazan ego.front_m.

ego:
  width_m: 1.8
  front_m: 1.5              # cámara → parachoques delantero
  lateral_margin_m: 0.5     # corredor = (w_ego + w_obj)/2 + margen
  passing_margin_m: 1.5     # objeto de paso: CAUTION como máximo si d_CPA cae dentro de corredor + este margen

k_sigma: 1.5                # cotas conservadoras: Z − kσ_Z, −V_Z + kσ_VZ, |X| − kσ_X
k_sigma_path: 1.0           # trayectoria: d_CPA + kσ_d < semicorredor (en trayectoria con confianza). σ_d ∝ t_CPA·σ_V,
                            # una cota inferior convertiría un coche que pasa a 1.5 m en objetivo (WARNING/CRITICAL).

levels:                     # umbrales de entrada por nivel (en corredor / en trayectoria)
  ttc_enter_s:   {caution: 4.0, warning: 2.5, critical: 1.2}
  dist_enter_m:  {caution: 12.0, warning: 6.0, critical: 3.0}   # compuerta de proximidad (sin velocidad)
  enter_frames:  {caution: 3, warning: 2, critical: 1}         # frames consecutivos para subir
  path_frames: 3            # mínimo si el objetivo está en trayectoria sólo por su CPA (fuera del corredor ahora)

hysteresis:
  exit_time_factor: 1.3     # umbral de salida = entrada × 1.3 (tiempo)
  exit_dist_factor: 1.2     #                            × 1.2 (distancia)
  exit_dwell_s: 0.5         # la condición de bajada debe sostenerse este tiempo
  min_dwell_s: 0.5          # ningún nivel baja antes de haberse mantenido este tiempo
  lost_decay_s: 0.5         # track perdido: baja un nivel cada 0.5 s, nunca sube
  forget_s: 2.0

confirmation:               # un track sin confirmar nunca sube de nivel
  min_updates: 3
  max_coast_s: 0.3
  max_pos_sigma_m: 3.0      # sqrt(σ²_X + σ²_Z)

classes:                    # anchura/longitud para corredor y hueco (nombres del detector)
  car:        {width_m: 1.8, length_m: 4.3}
  truck:      {width_m: 2.5, length_m: 8.0}
  bus:        {width_m: 2.5, length_m: 11.0}
  person:     {width_m: 0.6, length_m: 0.5}
  bicycle:    {width_m: 0.6, length_m: 1.7}
  motorcycle: {width_m: 0.8, length_m: 2.1}
  default:    {width_m: 1.8, length_m: 4.3}
